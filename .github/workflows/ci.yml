name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main always finish, so that a cancelled
  # run never shows up as a failed "All checks" on a commit of the default branch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides from the changed files which test jobs a change needs; the Prettier check always runs.
  # A path that is not listed, a workflow change, or a change set that cannot be listed runs every
  # job.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.classify.outputs.python }}
      client: ${{ steps.classify.outputs.client }}
      browser: ${{ steps.classify.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide which test jobs are needed
        id: classify
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as a merge commit whose first parent is the base branch.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base=HEAD^1; else base="$BEFORE"; fi
          python=false client=false browser=false
          if changed=$(git diff --name-only "$base" HEAD); then
            while IFS= read -r path; do
              case "$path" in
                "") ;;
                # Server code and runtime input: Python suite and the browser tests' real server.
                src/* | config/* | pyproject.toml | uv.lock | .python-version)
                  python=true browser=true ;;
                # The browser tests' server is also linted with the Python suite.
                tests/browser/*) python=true browser=true ;;
                # Python tests, scripts (linted and rule-checked), fixtures from submodules.
                tests/* | scripts/* | third_party/* | runtimes.lock.toml) python=true ;;
                client/e2e/* | client/playwright.config.ts) browser=true ;;
                client/*) client=true browser=true ;;
                # Documentation, formatter settings and files no test reads: Prettier only.
                docs/* | *.md | LICENSE | .github/ISSUE_TEMPLATE/* | .github/dependabot.yml) ;;
                package.json | package-lock.json | .prettierrc.json | .prettierignore) ;;
                .pre-commit-config.yaml | .gitignore | .env.example | docker/*) ;;
                *) python=true client=true browser=true ;;
              esac
            done <<< "$changed"
            printf '%s\n' "$changed"
          else
            echo "Cannot list the changed files; running every job."
            python=true client=true browser=true
          fi
          echo "python=$python client=$client browser=$browser" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'python=%s\nclient=%s\nbrowser=%s\n' "$python" "$client" "$browser" >> "$GITHUB_OUTPUT"

  formatting:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install formatter
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
    env:
      # Overrides .python-version, which pins the default development version.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      # The end-to-end tests speak a recording from Confucius4-R2T2, and a rule test compares its
      # chat template; the large runtime sources are not needed.
      - name: Check out test fixtures from submodules
        run: git submodule update --init --depth 1 third_party/Confucius4-R2T2

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra agent --locked

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Check formatting
        run: uv run ruff format --check src tests scripts

      - name: Test
        run: uv run pytest

  client:
    name: Web client
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  e2e:
    name: Browser end-to-end
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra agent
          npm ci
          npm ci --prefix client

      - name: Build web client
        run: npm run build --prefix client

      - name: Install browser engines and system dependencies
        working-directory: client
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start virtual audio output
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e
          pactl list short sinks

      - name: Test all browser engines
        env:
          # shortcut: 锁定的 Linux WebKit 会挂起离屏静音流；包含上游 319380 修复后移除。
          WEBKIT_GST_ALLOW_PLAYBACK_OF_INVISIBLE_VIDEOS: "1"
        run: npm run test:e2e --prefix client

      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 3
          if-no-files-found: ignore

  # The only check required by the branch ruleset, so the job matrix can change without
  # touching repository settings. A skipped job counts as passed only when the classification said
  # the change does not need it.
  all-checks:
    name: All checks
    if: always()
    needs: [changes, formatting, python, client, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        if: >-
          needs.changes.result != 'success' ||
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (needs.python.result == 'skipped' && needs.changes.outputs.python != 'false') ||
          (needs.client.result == 'skipped' && needs.changes.outputs.client != 'false') ||
          (needs.e2e.result == 'skipped' && needs.changes.outputs.browser != 'false')
        run: exit 1

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main always finish, so that a cancelled
  # run never shows up as a failed "All checks" on a commit of the default branch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  formatting:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install formatter
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
    env:
      # Overrides .python-version, which pins the default development version.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      # Two tests read sample files from these submodules; the large runtime sources are not needed.
      - name: Check out test fixtures from submodules
        run: git submodule update --init --depth 1 third_party/NeMo-Speech.cpp third_party/Confucius4-R2T2

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra agent --locked

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Check formatting
        run: uv run ruff format --check src tests scripts

      - name: Test
        run: uv run pytest

  client:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra agent
          npm ci
          npm ci --prefix client

      - name: Build web client
        run: npm run build --prefix client

      - name: Install browser engines and system dependencies
        working-directory: client
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start virtual audio output
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e
          pactl list short sinks

      - name: Test all browser engines
        env:
          GST_DEBUG: "2,webkitmediastreamsrc:6,webkitmediaplayer:5,webkitvideoframe:6,appsrc:5"
          GST_DEBUG_NO_COLOR: "1"
          DEBUG: "pw:browser"
        run: npm run test:e2e --prefix client

      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 3
          if-no-files-found: ignore

  # The only check required by the branch ruleset, so the job matrix can change without
  # touching repository settings.
  all-checks:
    name: All checks
    if: always()
    needs: [formatting, python, client, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
